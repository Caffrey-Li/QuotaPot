name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Pack DSH plugin
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Pack MCP server
        run: |
          cd agents/mcp
          npm pack --pack-destination ../../dist
      - name: Build Cursor VSIX
        run: |
          cd agents/cursor-extension
          npx --yes @vscode/vsce@latest package --no-dependencies --allow-missing-repository
          cp quotapot-0.2.0.vsix ../../dist/
      - name: Bundle agent hosts
        run: |
          mkdir -p dist/agents
          cp -R agents/mcp agents/templates agents/README.md dist/agents/
          cp agents/cursor-extension/quotapot-0.2.0.vsix dist/agents/
          cd dist && zip -qr quotapot-agents-0.4.1.zip agents
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
