<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>QuotaPot demo</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% 15%, #eef2ff 0%, #f7f8fc 45%, #eef1f7 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: #6e6e73;
  }
  .hint { position: fixed; left: 32px; top: 28px; font-size: 12px; letter-spacing: .3px; color: #8e8e93; }
</style>
</head>
<body>
<div class="hint">QuotaPot · DeepSeek 余额与用量</div>
<script>
  window.__QUOTAPOT__ = {
    token: 'demo',
    version: '0.4.1',
    config: { refreshSeconds: 30, lowBalanceThreshold: 5, dailyTokenLimit: 2000000, diskThresholdGB: 3, position: 'bottom-right', locale: 'zh' }
  }
  const usageData = {
    ok: true,
    days: 1,
    totals: {
      tokens: 1842300, input: 240000, cacheRead: 1500000, cacheWrite: 0, output: 102300,
      calls: 48, spanMs: 13320000, spanSumMs: 13320000
    },
    owners: [
      { key: 'session-chief', name: 'Chief', kind: 'bot', tokens: 1200000, input: 160000, cacheRead: 980000, cacheWrite: 0, output: 60000, calls: 22, spanMs: 4800000 },
      { key: 'session-writer', name: 'Writer', kind: 'bot', tokens: 400000, input: 50000, cacheRead: 320000, cacheWrite: 0, output: 30000, calls: 16, spanMs: 2700000 },
      { key: 'session-coder', name: 'Coder', kind: 'bot', tokens: 242300, input: 30000, cacheRead: 200000, cacheWrite: 0, output: 12300, calls: 10, spanMs: 5820000 }
    ],
    daily: { tokens: 1842300, limit: 2000000, exceeded: false },
    updatedAt: Date.now()
  }
  const balanceData = {
    ok: true,
    isAvailable: true,
    balances: [{ currency: 'CNY', total: '34.21', toppedUp: '30.45', granted: '3.76' }],
    usage: { todayTokens: 1842300, limit: 2000000, exceeded: false },
    updatedAt: Date.now()
  }
  const GB = 1073741824
  const updateData = { current: '0.4.1', latest: '0.4.1', available: false, url: 'https://github.com/Caffrey-Li/dsh-bot-QuotaPot/releases/tag/v0.4.1', notes: '', checkedAt: Date.now() }
  const diskItems = [
    { id: 'cursor', label: 'Cursor', path: '/Users/demo/Library/Application Support/Cursor', size: Math.round(19.9 * GB), safe: false },
    { id: 'codex', label: 'Codex data', path: '/Users/demo/.codex', size: Math.round(4.21 * GB), safe: false },
    { id: 'playwright', label: 'Playwright browsers', path: '/Users/demo/Library/Caches/ms-playwright', size: Math.round(3.06 * GB), safe: true },
    { id: 'pnpm', label: 'pnpm store', path: '/Users/demo/Library/pnpm/store', size: Math.round(1.54 * GB), safe: true },
    { id: 'cursor-cacheddata', label: 'Cursor CachedData', path: '/Users/demo/Library/Application Support/Cursor/CachedData', size: Math.round(1.24 * GB), safe: true },
    { id: 'dsh', label: 'DSH / DS Bot data', path: '/Users/demo/.dsh', size: Math.round(0.71 * GB), safe: false },
    { id: 'npm', label: 'npm cache', path: '/Users/demo/.npm/_cacache', size: Math.round(0.26 * GB), safe: true },
  ]
  const diskData = { ok: true, items: diskItems, free: Math.round(26.2 * GB), thresholdGB: 3, scannedAt: Date.now() }
  const agentsData = {
    ok: true,
    items: [
      { id: 'workbuddy', name: 'WorkBuddy', kind: 'credits', ok: true, sessions: 521, credits: { total: 4756.59, today: 0, sevenDays: 0, thirtyDays: 71.49 } },
      { id: 'zcode', name: 'ZCode', kind: 'plan', ok: true, plans: [
        { id: 'builtin:zai-start-plan', label: 'Z.ai Start', status: 'available', reason: null },
        { id: 'builtin:zai-coding-plan', label: 'Z.ai Coding', status: 'unavailable', reason: 'coding_plan_not_entitled' },
      ], updatedAt: Date.now() },
      { id: 'claude', name: 'Claude', kind: 'unavailable', reason: 'NO_LOCAL_USAGE' },
      { id: 'trae', name: 'Trae', kind: 'unavailable', reason: 'NO_LOCAL_USAGE' },
    ],
    updatedAt: Date.now(),
  }
  const realFetch = window.fetch.bind(window)
  window.fetch = (url, options) => {
    if (String(url).startsWith('/quotapot/update-check')) {
      return Promise.resolve(new Response(JSON.stringify(updateData), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/update')) {
      return Promise.resolve(new Response(JSON.stringify({ ok: true, version: '0.3.1', restartRequired: true }), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/disk/clean')) {
      const body = JSON.parse(options?.body || '{}')
      const freed = diskItems.filter(item => (body.ids || []).includes(item.id)).reduce((sum, item) => sum + item.size, 0)
      return Promise.resolve(new Response(JSON.stringify({ ok: true, freed, cleaned: body.ids, errors: [] }), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/agents')) {
      return Promise.resolve(new Response(JSON.stringify(agentsData), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/disk')) {
      return Promise.resolve(new Response(JSON.stringify(diskData), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/balance')) {
      return Promise.resolve(new Response(JSON.stringify(balanceData), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/usage')) {
      return Promise.resolve(new Response(JSON.stringify(usageData), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    if (String(url).startsWith('/quotapot/activity')) {
      return Promise.resolve(new Response(JSON.stringify({ ok: true, active: 1 }), { status: 200, headers: { 'content-type': 'application/json' } }))
    }
    return realFetch(url, options)
  }
</script>
<script src="../widget.js"></script>
<script>
  setTimeout(() => {
    document.getElementById('quotapot-host')?.shadowRoot?.querySelector('.pill')?.click()
  }, 900)
  if (new URLSearchParams(location.search).get('tab') === 'usage') {
    setTimeout(() => {
      document.getElementById('quotapot-host')?.shadowRoot?.querySelectorAll('.tab')[1]?.click()
    }, 1300)
  }
  if (new URLSearchParams(location.search).get('tab') === 'space') {
    setTimeout(() => {
      document.getElementById('quotapot-host')?.shadowRoot?.querySelectorAll('.tab')[2]?.click()
    }, 1500)
  }
  if (new URLSearchParams(location.search).get('tab') === 'agents') {
    setTimeout(() => {
      document.getElementById('quotapot-host')?.shadowRoot?.querySelectorAll('.tab')[3]?.click()
    }, 1500)
  }


  if (new URLSearchParams(location.search).get('pose') === 'float') {
    setTimeout(() => {
      const pet = document.getElementById('quotapot-host')?.shadowRoot?.querySelector('.pet')
      if (!pet) return
      pet.getAnimations().forEach(animation => animation.cancel())
      pet.className = 'pet floating'
      pet.style.transform = 'translateX(117px) translateY(0px) rotate(0deg)'
    }, 1600)
  }
  if (new URLSearchParams(location.search).get('pose') === 'apex') {
    setTimeout(() => {
      const pet = document.getElementById('quotapot-host')?.shadowRoot?.querySelector('.pet')
      if (!pet) return
      pet.getAnimations().forEach(animation => animation.cancel())
      pet.className = 'pet breaching'
      pet.style.transform = 'translateX(126.4px) translateY(-26px) rotate(0deg)'
    }, 2000)
  }
</script>
</body>
</html>
